name: Sync Sources and Release

# Superseded. The TradingView (v1.1.0) sources now travel directly through the GitHub
# API, so the artifact-CDN download this workflow used is no longer part of the
# pipeline. It is kept as a no-op on its own trigger path so the historical trigger
# stays green; the build itself is handled by `dev-push-build.yml`.

on:
  push:
    branches: [ main ]
    paths:
      - '.sync/legacy-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    name: Retired bootstrap
    runs-on: ubuntu-24.04
    steps:
      - name: Explain
        run: echo "The source sync now happens through the GitHub API; nothing to do here."
