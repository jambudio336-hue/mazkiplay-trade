name: Dev Push Build

# Builds and publishes the release APK for the TradingView (v1.1.0) upgrade.
#
# It triggers on a change to `.sync/trigger` so an API-driven source push can start a
# build without disturbing the Android workflow. `android-release.yml` keeps owning
# ordinary pushes to `main` and version tags.

on:
  push:
    branches: [ main ]
    paths:
      - '.sync/trigger'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dev-push-build
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build and publish the release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then SDK="$HOME/android-sdk"; fi
          mkdir -p "$SDK/cmdline-tools"
          CMDLINE=$(find "$SDK/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | head -n1 || true)
          if [ -z "$CMDLINE" ]; then
            echo "sdkmanager not found - downloading the Android command line tools."
            curl -sSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            rm -rf /tmp/cmdline-tmp
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tmp
            rm -rf "$SDK/cmdline-tools/latest"
            mv /tmp/cmdline-tmp/cmdline-tools "$SDK/cmdline-tools/latest"
            CMDLINE="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "Using sdkmanager: $CMDLINE"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$(dirname "$CMDLINE")" >> "$GITHUB_PATH"

      - name: Install SDK packages
        run: |
          set +e
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses > /dev/null 2>&1
          sdkmanager --list_installed | head -n 40
          exit 0

      - name: Install Gradle 8.9
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.9/bin" >> "$GITHUB_PATH"
          /opt/gradle-8.9/bin/gradle --version

      - name: Install image tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin

      - name: Generate launcher icons and splash art
        run: |
          chmod +x tools/generate-icons.sh
          ./tools/generate-icons.sh

      - name: Prepare release keystore
        run: |
          set -euo pipefail
          mkdir -p keystore
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Using keystore from repository secrets."
            printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore/release.jks
          else
            echo "No KEYSTORE_BASE64 secret found - generating a self-signed demo keystore."
            keytool -genkeypair -v \
              -keystore keystore/release.jks \
              -alias mazkiplay \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass mazkiplay123 -keypass mazkiplay123 \
              -dname "CN=Mazkiplay Trade, OU=Mobile, O=Nusantara Forex, L=Jakarta, ST=DKI Jakarta, C=ID"
          fi

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build debug APK (sanity check)
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Locate build output
        id: apk
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name "*.apk" -type f | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::Release APK not found"
            ls -R app/build/outputs || true
            exit 1
          fi
          NAME="mazkiplay-trade-v1.1.0.apk"
          cp "$APK" "app/build/outputs/apk/release/$NAME"
          echo "apk_name=$NAME" >> "$GITHUB_OUTPUT"
          ls -lh app/build/outputs/apk/release/

      - name: Upload release APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: mazkiplay-trade-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release v1.1.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: Mazkiplay Trade v1.1.0
          draft: false
          prerelease: false
          generate_release_notes: true
          files: app/build/outputs/apk/release/${{ steps.apk.outputs.apk_name }}
