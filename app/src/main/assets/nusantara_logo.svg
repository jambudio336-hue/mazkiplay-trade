<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1B2B"/>
      <stop offset="0.55" stop-color="#0F2A3D"/>
      <stop offset="1" stop-color="#06121C"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE9A3"/>
      <stop offset="0.45" stop-color="#F2C230"/>
      <stop offset="1" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22C55E"/>
      <stop offset="1" stop-color="#0E7490"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- batik-inspired concentric petals -->
  <g opacity="0.16" fill="none" stroke="#22D3EE" stroke-width="3">
    <circle cx="256" cy="256" r="196"/>
    <circle cx="256" cy="256" r="170"/>
    <circle cx="256" cy="256" r="144"/>
  </g>

  <!-- nusantara waves -->
  <g opacity="0.55">
    <path d="M40 372 q54 -30 108 0 t108 0 t108 0 t108 0" fill="none" stroke="url(#ring)" stroke-width="9" stroke-linecap="round"/>
    <path d="M40 406 q54 -30 108 0 t108 0 t108 0 t108 0" fill="none" stroke="#22D3EE" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
    <path d="M40 340 q54 -30 108 0 t108 0 t108 0 t108 0" fill="none" stroke="#22C55E" stroke-width="5" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- gold coin with an upward chart -->
  <circle cx="256" cy="228" r="126" fill="url(#gold)"/>
  <circle cx="256" cy="228" r="106" fill="none" stroke="#0B1B2B" stroke-width="6" opacity="0.35"/>

  <polyline points="186,272 224,222 258,246 300,176 330,192"
            fill="none" stroke="#0B1B2B" stroke-width="16"
            stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="300,176 338,168 326,204" fill="#0B1B2B"/>

  <g fill="#0B1B2B" opacity="0.85">
    <rect x="196" y="284" width="18" height="34" rx="5"/>
    <rect x="226" y="292" width="18" height="26" rx="5"/>
    <rect x="256" y="280" width="18" height="38" rx="5"/>
    <rect x="286" y="296" width="18" height="22" rx="5"/>
  </g>

  <!-- NF monogram badge -->
  <circle cx="400" cy="112" r="52" fill="url(#bg)" stroke="url(#gold)" stroke-width="7"/>
  <text x="400" y="129" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"
        font-size="46" font-weight="bold" fill="url(#gold)" text-anchor="middle">NF</text>
</svg>
